<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#e6e5ef" />

    <title>TOTONO</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e6e5ef;
        color: #3e3a3a;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Helvetica Neue",
          sans-serif;
      }

      main {
        padding:
          env(safe-area-inset-top)
          24px
          env(safe-area-inset-bottom);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.12em;
      }

      p {
        margin: 16px 0 0;
        font-size: 14px;
        line-height: 1.8;
        opacity: 0.72;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>TOTONO</h1>

      <p>
        サウナへ行く前から、<br />
        整い始める。
      </p>
    </main>
  </body>
</html>
